[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "previsit-agent"
version = "0.1.0"
description = "Pre-visit clinical intelligence agent over synthetic (Synthea) patient data — care-gap detection and documentation-completeness checking, not diagnosis or billing."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"

dependencies = [
    # config
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    # relational DB (Phase 2+)
    "pymssql==2.4.1",
    "SQLAlchemy==2.0.52",
    # vector store / embeddings (Phase 4)
    "qdrant-client==1.19.0",
    "sentence-transformers==6.0.0",
    # agent framework (Phase 5)
    "langgraph==1.2.11",
    "langchain-core==1.6.0",
    # LLM providers (Phase 5) — swappable, see src/previsit/llm/. Each
    # wraps LangChain's BaseChatModel so graph.py's bind_tools/structured
    # output calls are identical regardless of provider; langchain-openai
    # is for the Azure OpenAI client (unused by default, proves portability).
    "langchain-google-genai==4.3.5",
    "langchain-groq==1.1.3",
    "langchain-openai==1.6.0",
    # API layer (Phase 7)
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    # MCP server (Phase 7)
    "mcp[cli]==2.1.0",
    # demo UI (Phase 7)
    "streamlit==1.62.0",
    # experiment tracking (Phase 6)
    "mlflow==3.15.1",
    # data wrangling (eval + ingest)
    "pandas==2.3.3",  # pinned <3: mlflow 3.15.1 requires pandas<3
    "numpy==2.4.6",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/previsit"]

# Local dev and CI use hatchling (the declared [build-system] backend) via
# `pip install -e .`, which reads [tool.hatch.build] above. Streamlit
# Community Cloud's builder uses Poetry instead when it finds a
# pyproject.toml, and Poetry does not read hatchling's own packages config -
# without this section it fails outright ("No file/folder found for package
# previsit-agent") trying to install the project using its own convention
# (a directory matching the project name at the repo root), which doesn't
# match this src-layout package. Verified directly against a real Poetry
# install, not assumed from documentation: package-mode = false alone (the
# error message's other suggested fix) makes the install succeed but leaves
# `previsit` genuinely unimportable at runtime - this `packages` declaration
# is the one that actually installs the package correctly under Poetry too.
[tool.poetry]
packages = [{ include = "previsit", from = "src" }]

[tool.ruff]
# Raised from the original 100 to 120 when CI was added (Phase 8): `ruff
# check .` had never actually been run against the real codebase before,
# and at 100 it flagged 247 pre-existing violations, almost all of them
# long, information-dense inline comments explaining a non-obvious WHY -
# this project's deliberate documentation style throughout, not a lapse.
# 120 leaves a small number of genuinely long lines to fix directly rather
# than raising the limit further to paper over them.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 (function call in a default argument) is a real footgun in general,
# but `Depends(...)` in a default argument is FastAPI's own documented
# dependency-injection pattern, not a mistake - FastAPI resolves it at
# request time, it isn't evaluated once at import time the way B008 warns
# against.
"src/previsit/api/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
